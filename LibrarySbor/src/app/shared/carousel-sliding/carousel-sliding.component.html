<div class="container my-4">
    <div class="card border-0 p-3">

        <ngb-carousel>

            <ng-container *ngFor="let slide of slidesInfo">
                <ng-template ngbSlide>
                    <div class="d-flex justify-content-center">
                        <div class="carousel-img-wrapper">
                            <img [src]="slide.image" alt="Снимка на читалището." />
                        </div>
                    </div>
                    <div class="carousel-caption-custom text-center mt-3">
                        <h5 class="fw-semibold mb-0" [innerText]="slide.title"></h5>
                    </div>

                </ng-template>
            </ng-container>

        </ngb-carousel>

    </div>
</div>
