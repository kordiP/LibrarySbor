    <div class="container">

        <div class="row justify-content-center">

        <div class="row mt-5">

                <div class="d-flex flex-wrap justify-content-center gap-3">

                    <a class="doc-link" href="assets/docs/report2025.pdf" download>

        <div *ngIf="showAlert" class="mt-3 alert-wrapper show">
